[package]
name = "window-warp"
version = "0.1.0"
description = "Window shortcuts for Windows and KDE Plasma"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
lz4_flex = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
libc = "0.2"
x11rb = "0.13"
gio = "0.18"

[target.'cfg(windows)'.dependencies]
tauri-plugin-global-shortcut = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Storage_Packaging_Appx"] }
