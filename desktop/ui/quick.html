<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Window Warp</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script src="shortcut-picker.js" defer></script>
  <script src="quick.js" defer></script>
</head>
<body class="quick-body">
  <div class="quick-sheet" role="dialog" aria-labelledby="quick-title">
    <h2 id="quick-title">Shortcut</h2>
    <p id="quick-app" class="quick-app"></p>
    <label class="key-field quick-key">
      <input id="quick-entry" readonly placeholder="Press a key" spellcheck="false" aria-label="Shortcut">
    </label>
    <div class="mod-row" id="quick-mods">
      <button type="button" data-mod="Super" aria-pressed="false">Super</button>
      <button type="button" data-mod="Ctrl" aria-pressed="false">Ctrl</button>
      <button type="button" data-mod="Alt" aria-pressed="false">Alt</button>
      <button type="button" data-mod="Shift" aria-pressed="false">Shift</button>
      <button type="button" class="clear-shortcut">Clear</button>
    </div>
    <p id="quick-hint">Press a key, then Enter. Super, Ctrl, Alt, and Shift are the buttons below. Escape closes this.</p>
    <p class="behavior-heading">Behavior</p>
    <label>If it is already on the main monitor
      <select id="quick-behavior">
        <option value="focus-last">Switch back to the previous app</option>
        <option value="burner">Move to the second monitor</option>
      </select>
    </label>
    <label>On the second monitor
      <select id="quick-layout">
        <option value="float">Keep size and place</option>
        <option value="tile-left">Left half</option>
        <option value="tile-right">Right half</option>
        <option value="fullscreen">Fill the monitor</option>
      </select>
    </label>
    <p id="quick-message" role="status"></p>
    <div id="quick-conflict" hidden>
      <p id="quick-conflict-summary"></p>
      <button id="quick-replace" type="button">Replace shortcut</button>
      <button id="quick-keep" type="button">Keep existing shortcut</button>
    </div>
    <div class="quick-actions">
      <button id="quick-open" type="button">Go to Warp</button>
      <span>
        <button id="quick-apply" class="primary" type="button">Apply</button>
        <button id="quick-cancel" type="button">Cancel</button>
      </span>
    </div>
  </div>
</body>
</html>
