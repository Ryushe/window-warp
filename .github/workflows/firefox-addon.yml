name: Package Firefox add-on

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: firefox-addon-package
  cancel-in-progress: false

jobs:
  package:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    env:
      NO_UPDATE_NOTIFIER: '1'
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Prepare Firefox extension
        run: node scripts/firefox-release.mjs prepare "$RUNNER_TEMP/window-warp-firefox"
      - name: Validate Firefox extension
        run: npx --no-install web-ext lint --source-dir "$RUNNER_TEMP/window-warp-firefox/extension" --no-config-discovery
      - name: Build ZIP for manual submission
        run: >-
          npx --no-install web-ext build
          --source-dir "$RUNNER_TEMP/window-warp-firefox/extension"
          --artifacts-dir "$RUNNER_TEMP/window-warp-firefox/artifacts"
          --no-config-discovery
      - name: Keep ZIP for manual submission
        uses: actions/upload-artifact@v4
        with:
          name: window-warp-firefox-manual-submission
          path: ${{ runner.temp }}/window-warp-firefox/artifacts/*.zip
          if-no-files-found: error
