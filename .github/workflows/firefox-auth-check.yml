name: Verify Firefox credentials (read-only)

on:
  push:
    branches: [codex/firefox-auth-check-01a1af66]
    paths: [.github/workflows/firefox-auth-check.yml]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check Mozilla authentication without submitting
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          node --input-type=module <<'NODE'
          import {createHmac, randomUUID} from 'node:crypto';

          const issuer = process.env.AMO_JWT_ISSUER;
          const secret = process.env.AMO_JWT_SECRET;
          if (!issuer || !secret) {
            console.log('::error title=Mozilla credential check::The Mozilla issuer or secret is not configured in GitHub Actions.');
            process.exit(1);
          }

          const encode = value => Buffer.from(JSON.stringify(value)).toString('base64url');
          function jwt(signingKey) {
            const now = Math.floor(Date.now() / 1000);
            const body = `${encode({alg:'HS256',typ:'JWT'})}.${encode({iss:issuer,jti:randomUUID(),iat:now,exp:now+60})}`;
            return `${body}.${createHmac('sha256',signingKey).update(body).digest('base64url')}`;
          }
          async function probe(signingKey) {
            const response = await fetch('https://addons.mozilla.org/api/v5/addons/addon/window-warp%40ryushe.local/versions/?filter=all_with_unlisted&page_size=1', {
              method: 'GET',
              headers: {Accept:'application/json', Authorization:`JWT ${jwt(signingKey)}`},
              redirect:'error', signal:AbortSignal.timeout(15000)
            });
            return response.status;
          }

          try {
            const actual = await probe(secret);
            const control = await probe('window-warp-invalid-signature-control');
            if (![401,403].includes(control)) {
              console.log(`::error title=Mozilla credential check::Cannot confirm that this endpoint checks credentials (control HTTP ${control}).`);
              process.exitCode = 1;
            } else if (actual === 200) {
              console.log('Mozilla accepted the credentials. No upload or submission was made.');
            } else if (actual === 404) {
              console.log('Mozilla accepted the credentials; the add-on was not found or is not visible. No upload or submission was made.');
            } else {
              console.log(`::error title=Mozilla credential check::Mozilla authentication was not confirmed (HTTP ${actual}). No upload or submission was made.`);
              process.exitCode = 1;
            }
          } catch (error) {
            const names = new Set(['AbortError','TimeoutError','TypeError']);
            const reason = names.has(error?.name) ? error.name : 'NetworkError';
            console.log(`::error title=Mozilla credential check::The read-only Mozilla API request failed (${reason}).`);
            process.exitCode = 1;
          }
          NODE
